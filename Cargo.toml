[package]
name = "upgradelab-runner"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"
authors = ["Anas Abubakar"]
description = "Executable Soroban migration rehearsal: runs the compiled old and new WASM in the Soroban host, upgrades, migrates and evaluates named invariants."
publish = false
default-run = "upgradelab"

[lib]
name = "upgradelab"
path = "src/lib.rs"

[[bin]]
name = "upgradelab"
path = "src/main.rs"

[dependencies]
soroban-sdk = { version = "=28.0.0", features = ["testutils"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
soroban-ledger-snapshot = "=28.0.0"
sha2 = "0.10"
stellar-strkey = "0.0.16"
ed25519-dalek = "2"
schemars = "1"
clap = { version = "4", features = ["derive"] }

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

[[test]]
name = "it"
path = "tests/it/main.rs"
