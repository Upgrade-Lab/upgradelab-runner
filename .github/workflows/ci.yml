name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Fixture native SDK tests (separate category)
        run: cargo test
        working-directory: fixtures/contracts
      - name: Schemas are current
        run: |
          cargo run -q -- schema report | diff - schema/report.v1.schema.json
          cargo run -q -- schema scenario | diff - schema/scenario.v1.schema.json
